name: Build Fazaa Customer APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-client/**'
      - '.github/workflows/customer-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build customer APK
        working-directory: android-client
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: fazaa-customer-test-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
