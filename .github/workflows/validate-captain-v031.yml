name: Validate Fazaa Captain 0.3.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fazaa_commercial_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: fazaa_commercial_test
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Apply prior migrations and exercise existing pricing protections
        working-directory: captain-release-tests
        run: |
          for file in base-fixture.sql prior-migrations.sql 07-fares-fleet-ledger.sql 08-private-trial.sql commercial-checks.sql private-trial-checks.sql 09-vehicle-suggestions.sql vehicle-checks.sql 10-vehicle-categories.sql category-checks.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify read-only offer discovery and assignment protection
        working-directory: captain-release-tests
        run: |
          psql -v ON_ERROR_STOP=1 -f 13-captain-readonly-dispatch.sql
          psql -v ON_ERROR_STOP=1 -f 13-captain-readonly-dispatch.sql
          psql -v ON_ERROR_STOP=1 -f readonly-dispatch-checks.sql
      - name: Verify Captain details migration and repeat safety
        working-directory: captain-release-tests
        run: |
          psql -v ON_ERROR_STOP=1 -f 12-captain-trip-details.sql
          psql -v ON_ERROR_STOP=1 -f 12-captain-trip-details.sql
          psql -v ON_ERROR_STOP=1 -f captain-checks.sql
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify update targets, trip stages and OsmAnd
        run: |
          mkdir -p /tmp/captain-tests
          javac -encoding UTF-8 -d /tmp/captain-tests captain-release-tests/fixture-android/app/src/main/java/com/fazaa/driver/UpdatePolicy.java captain-release-tests/fixture-android/app/src/main/java/com/fazaa/driver/DriverStage.java captain-release-tests/fixture-android/app/src/main/java/com/fazaa/driver/DriverDisplay.java captain-release-tests/fixture-android/app/src/main/java/com/fazaa/driver/OsmAndRoute.java captain-release-tests/*Checks.java
          java -cp /tmp/captain-tests UpdatePolicyChecks
          java -cp /tmp/captain-tests com.fazaa.driver.DriverStageChecks
          java -cp /tmp/captain-tests com.fazaa.driver.DriverDisplayChecks
          java -cp /tmp/captain-tests com.fazaa.driver.OsmAndRouteChecks
      - name: Verify release publishing order without network or credentials
        run: python3 captain-release-tests/publish-checks.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and lint isolated Captain candidate
        working-directory: captain-release-tests/fixture-android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
