<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خريطة فزعة</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css'">
<style>html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#edf0e9}#map{height:100%;direction:ltr}#note{position:absolute;top:12px;left:12px;right:12px;z-index:5;background:white;padding:10px;border-radius:10px;font-size:13px}.pin{display:grid;place-items:center;width:30px;height:30px;border:3px solid white;border-radius:50%;background:#277ad3;color:white;font-weight:bold;box-shadow:0 1px 5px #0005}.pin.driver{background:#ffb400;color:#1f2933}.pin.stale{background:#8a949a;color:white}</style></head>
<body><div id="map"></div><p id="note">جاري تحميل الخريطة…</p><script>
'use strict';let map,pending=[],markers=[],fitted=false;
function valid(p){return Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180;}
window.setPoints=function(points){pending=points.filter(valid);render();};
function render(){if(!map)return;for(const pin of markers)pin.remove();markers=[];for(const p of pending){const el=document.createElement('div');el.className='pin'+(p.driver?' driver':'')+(p.stale?' stale':'');el.textContent=p.driver?'س':'ع';el.setAttribute('aria-label',p.driver?'آخر موقع للسائق':'موقع العميل');markers.push(new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(map));}if(pending.length&&!fitted){fitted=true;if(pending.length===1)map.jumpTo({center:[pending[0].lng,pending[0].lat],zoom:15});else{const bounds=new maplibregl.LngLatBounds();for(const p of pending)bounds.extend([p.lng,p.lat]);map.fitBounds(bounds,{padding:55,maxZoom:16,duration:0});}}}
function init(){try{map=new maplibregl.Map({container:'map',center:[36.2765,33.5138],zoom:12,maxZoom:19,dragRotate:false,pitchWithRotate:false,renderWorldCopies:false,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});map.addControl(new maplibregl.NavigationControl({showCompass:false}));map.on('load',()=>{document.getElementById('note').hidden=true;render();});map.on('error',()=>{document.getElementById('note').hidden=false;document.getElementById('note').textContent='تعذّر تحميل بعض أجزاء الخريطة. تأكّد من اتصال الإنترنت.';});}catch(e){fail();}}
function fail(){document.getElementById('note').textContent='تعذّر تحميل الخريطة. ارجع للطلب واستخدم زر فتح الملاحة.';}
function fallback(){const s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js';s.onload=init;s.onerror=fail;document.head.appendChild(s);}
</script><script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js" onload="init()" onerror="fallback()"></script></body></html>
