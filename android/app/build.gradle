plugins { id 'com.android.application' }
android {
    namespace 'com.fazaa.driver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fazaa.driver'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.2.4-test'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.test'; versionNameSuffix '-debug' } }
}
